:root{--free:#2ee67a;--win:#ffd23a;--alert:#ff5a4f;--ink:#1a1004;--you:#ffc21a;--rival:#e0322b;--cta-top:#ffe066;--cta-bot:#ffb21a;--cta-base:#a35d00;--logo-edge:#8a4b00;--bg:#1a1410;--scrim-in:rgba(26,16,8,.55);--scrim-out:rgba(26,16,8,.8)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);touch-action:none;overscroll-behavior:none}
body{font-family:"Chakra Petch",Arial,sans-serif;color:#fff}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
video::-webkit-media-controls{display:none!important}
.ui{position:fixed;inset:0;pointer-events:none}
#hint{position:fixed;inset:0;pointer-events:auto;opacity:0;transition:opacity .3s}
body.ready #hint{opacity:1}
#hint.hidden{opacity:0!important;pointer-events:none}
.goal{position:absolute;left:0;right:0;top:max(calc(env(safe-area-inset-top) + 8px),5vh);padding:0 16px;font-family:Bungee,Impact,sans-serif;font-size:clamp(20px,6.2vmin,40px);line-height:1.1;text-align:center;text-shadow:0 3px 0 #000,0 0 18px rgba(0,0,0,.6);letter-spacing:.5px}
.goal b{color:var(--free);font-weight:400}
.swipe{position:absolute;left:50%;bottom:24%;width:min(46vmin,196px);margin-left:calc(min(46vmin,196px)/-2);height:150px}
.track{position:absolute;left:4%;top:22px;width:92%;height:auto;overflow:visible}
.track g{stroke:var(--ink)}
.hand{position:absolute;top:30px;left:50%;width:64px;height:78px;margin-left:-18px;animation:swipe 1.8s ease-in-out infinite;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5))}
@keyframes swipe{0%{opacity:0;transform:translateX(-60px) rotate(-12deg)}12%{opacity:1}85%{opacity:1;transform:translateX(60px) rotate(10deg)}100%{opacity:0;transform:translateX(60px) rotate(10deg)}}
.label{position:absolute;left:50%;top:100px;transform:translateX(-50%);white-space:nowrap;padding:5px 16px;border-radius:999px;background:rgba(0,0,0,.55);text-align:center;font-weight:700;font-size:18px;letter-spacing:1.5px;text-shadow:0 2px 0 #000}
#banner{white-space:pre-line;line-height:1.05;position:fixed;left:0;right:0;top:34%;text-align:center;font-family:Bungee,Impact,sans-serif;font-size:clamp(28px,10vmin,72px);opacity:0;transform:scale(.6);transition:opacity .15s,transform .25s cubic-bezier(.2,1.6,.4,1);text-shadow:0 4px 0 #000,0 0 24px rgba(0,0,0,.5);padding:0 16px;pointer-events:none}
#banner.show{opacity:1;transform:scale(1)}
#banner.warn{top:24%}
#banner.warn.show{animation:bshake .04s linear 3}
@keyframes bshake{0%,100%{translate:0 0}25%{translate:-5px 1px}75%{translate:5px -1px}}
#banner.go{color:var(--free)}#banner.win{color:var(--win)}#banner.lose{color:var(--alert)}
#banner.win span,#banner.lose span{position:relative;display:inline-block;font-size:.72em;color:var(--ink);text-shadow:none;border:4px solid var(--ink);border-radius:16px;padding:.42em .6em .26em;box-shadow:0 6px 0 rgba(0,0,0,.35)}
#banner.win span{background:var(--win)}#banner.lose span{background:var(--alert)}
#banner.win span::before,#banner.lose span::before{content:"";position:absolute;left:12px;right:12px;top:7px;height:4px;border-radius:2px;background:#fff}#banner.warn{color:var(--alert);font-size:clamp(22px,8vmin,52px)}
#edge{position:fixed;left:0;top:0;width:0;height:0;opacity:0;transition:opacity .15s;pointer-events:none}
#edge.on{opacity:1}
#edge .plate{position:absolute;left:-38px;top:-19px;width:76px;height:38px;border-radius:10px;background:var(--free);color:var(--ink);font:700 22px/38px "Chakra Petch",Arial,sans-serif;text-align:center;box-shadow:0 3px 8px rgba(0,0,0,.45);animation:edgepulse 1.2s ease-in-out infinite}
#edge .chev{position:absolute;left:-13px;top:-13px;width:26px;height:26px;overflow:visible}
#edge .chev path{transform-box:fill-box;transform-origin:center;animation:chevpulse 1.2s ease-in-out infinite}
@keyframes chevpulse{0%,100%{transform:scale(.95)}50%{transform:scale(1.1)}}
@keyframes edgepulse{0%,100%{filter:brightness(.9)}50%{filter:brightness(1.1)}}
#redge{position:fixed;left:0;bottom:calc(12px + env(safe-area-inset-bottom) + 28px);width:0;height:34px;opacity:0;transition:opacity .15s;pointer-events:none}
#redge.on{opacity:1}
#redge .plate{position:absolute;left:-36px;top:0;width:72px;height:34px;border-radius:10px;border:3px solid var(--ink);background:var(--rival);color:#fff;font:700 20px/28px "Chakra Petch",Arial,sans-serif;text-align:center;text-shadow:0 2px 0 #000}
#redge .chev{position:absolute;left:-13px;top:4px;width:26px;height:26px;overflow:visible}
#finger{position:fixed;left:50%;bottom:20vh;width:56px;height:56px;margin-left:-28px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(255,255,255,.9);box-shadow:0 0 18px rgba(0,0,0,.4);opacity:0;transition:opacity .2s;pointer-events:none}
#vig{background:radial-gradient(ellipse at center,transparent 45%,var(--alert) 140%);opacity:0}
#vig.on{animation:vig .35s ease-out}
@keyframes vig{0%,28%{opacity:1}100%{opacity:0}}
#confetti i{position:fixed;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{top:110%;transform:rotate(720deg) translateX(40px)}}
#end{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(var(--scrim-in),var(--scrim-out));opacity:0;pointer-events:none;transition:opacity .4s;padding:45vh 16px 28vh}
#end.show{opacity:1;pointer-events:auto}
.card{display:flex;flex-direction:column;align-items:center;gap:min(1.6vh,12px);text-align:center;max-width:520px;transform:translateY(20px);transition:transform .5s cubic-bezier(.2,1.4,.4,1)}
#end.show .card{transform:none}
#end.show #cta,#end.show #retry{pointer-events:auto}
.logo{display:flex;align-items:center;justify-content:center;gap:.14em;font-family:Bungee,Impact,sans-serif;font-size:clamp(34px,11vmin,78px);line-height:.95;color:var(--win);text-shadow:0 5px 0 var(--logo-edge),0 10px 24px rgba(0,0,0,.6)}

.logo span{white-space:nowrap}
.logo::before,.logo::after{content:"";flex:none;width:.28em;height:.09em;background:#fff;border-radius:2px;box-shadow:0 3px 0 rgba(0,0,0,.5)}
.logo .dot{display:inline-block;width:.18em;height:.18em;margin-left:.06em;border-radius:50%;background:var(--free);box-shadow:0 3px 0 rgba(0,0,0,.5)}
#end-title{font-family:Bungee,Impact,sans-serif;font-size:clamp(20px,5.6vmin,32px);text-shadow:0 3px 0 #000}
#end-title.win{color:var(--win)}#end-title.lose{color:var(--alert)}
#end-sub{font-size:16px;font-weight:700;opacity:.92;text-shadow:0 2px 0 #000;white-space:nowrap}
#cta{pointer-events:none;font-family:Bungee,Impact,sans-serif;font-size:clamp(20px,5.6vmin,32px);color:var(--ink);background:linear-gradient(var(--cta-top),var(--cta-bot));border:0;border-radius:999px;padding:.7em 1.4em;box-shadow:0 6px 0 var(--cta-base),0 12px 26px rgba(0,0,0,.5);animation:pulse 1.1s ease-in-out infinite;cursor:pointer}
#cta:active{transform:translateY(4px);box-shadow:0 2px 0 var(--cta-base)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
#retry{pointer-events:none;background:none;border:1.5px solid rgba(255,255,255,.45);border-radius:999px;color:#fff;font:700 16px "Chakra Petch",Arial,sans-serif;letter-spacing:2px;opacity:.85;min-height:44px;padding:0 20px;cursor:pointer}
@media (orientation:landscape){
 .swipe{left:min(80vw,calc(100vw - max(24px,env(safe-area-inset-right) + 16px) - 110px));margin-left:calc(min(34vmin,230px)/-2);bottom:12%;width:min(34vmin,230px)}
 #banner{top:18%}
 #banner.go{top:calc(42% - .5em)}
 #banner.warn{left:-5vw;right:auto;width:44vw;top:30%;font-size:7vh}
 #end{padding:8vh 16px}
 .card{gap:min(2vh,12px)}
}
@media (max-width:379px){.goal{font-size:clamp(18px,5.4vmin,40px)}}
@media (max-width:385px){
 .swipe{width:min(46vmin,122px);margin-left:calc(min(46vmin,122px)/-2)}
 .hand{animation-name:swipe-s}
 .label{font-size:13px;letter-spacing:1px;padding:6px 10px}
}
@keyframes swipe-s{0%{opacity:0;transform:translateX(-36px) rotate(-12deg)}12%{opacity:1}85%{opacity:1;transform:translateX(36px) rotate(10deg)}100%{opacity:0;transform:translateX(36px) rotate(10deg)}}
</style>
</head>

</div>

<div id="redge"><svg class="chev" viewBox="0 0 26 26" aria-hidden="true"><path d="M3 2L24 13L3 24L8 13Z" fill="var(--rival)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"></path></svg><div class="plate">RED</div></div>
<div id="finger"></div>
<div id="banner" class="ui"></div>

<div id="vig" class="ui"></div>
