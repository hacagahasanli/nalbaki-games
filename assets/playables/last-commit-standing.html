*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#3f7a2e;touch-action:none;overscroll-behavior:none}
body{font-family:"Chakra Petch",Arial,sans-serif;color:#fff}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;pointer-events:none}
#hint{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:15vh 16px 15vh;pointer-events:auto;opacity:0;transition:opacity .3s}
body.ready #hint{opacity:1}
#hint.hidden{opacity:0!important;pointer-events:none}
.goal{font-family:Bungee,Impact,sans-serif;font-size:clamp(20px,6.4vmin,40px);line-height:1.12;text-align:center;text-shadow:0 3px 0 #000,0 0 18px rgba(0,0,0,.6)}
.goal b{color:#ffd23f;font-weight:400}
.swipe{position:relative;width:min(70vmin,300px);height:118px}
.track{position:absolute;left:8%;right:8%;top:38px;height:10px;border-radius:6px;background:rgba(255,255,255,.3);box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.track:before,.track:after{content:"";position:absolute;top:-7px;border:12px solid transparent}
.track:before{left:-20px;border-right-color:rgba(255,255,255,.75)}
.track:after{right:-20px;border-left-color:rgba(255,255,255,.75)}
.hand{position:absolute;top:24px;left:50%;width:64px;height:78px;margin-left:-18px;animation:swipe 1.8s ease-in-out infinite;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5))}
@keyframes swipe{0%,100%{transform:translateX(-80px) rotate(-12deg)}50%{transform:translateX(80px) rotate(10deg)}}
.label{position:absolute;left:0;right:0;bottom:0;text-align:center;font-weight:700;font-size:19px;text-shadow:0 2px 0 #000,0 0 10px rgba(0,0,0,.5)}
#hud{position:fixed;left:0;right:0;top:10.5vh;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;opacity:0;transition:opacity .3s}
#hud.show{opacity:1}
#alive{font-weight:700;font-size:16px;background:rgba(12,16,28,.72);border:2px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 14px;display:flex;align-items:center;gap:7px}
#alive b{font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:20px;color:#ffd23f}
#alive.two{border-color:#ff4b4b;animation:beat .5s ease-in-out 3}
#alive.two b{color:#ff6b6b}
@keyframes beat{50%{transform:scale(1.15)}}
#feed{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:60px}
#feed div{font-weight:700;font-size:14px;background:rgba(12,16,28,.62);border-radius:6px;padding:2px 10px;animation:slide .25s ease-out}
#feed div i{font-style:normal;color:#ff8a7a}
#feed div u{text-decoration:none;color:#7dffb0}
@keyframes slide{from{opacity:0;transform:translateY(-8px)}}
#tip{position:fixed;left:0;right:0;bottom:24vh;text-align:center;font-family:Bungee,Impact,sans-serif;font-size:clamp(17px,5vmin,28px);text-shadow:0 3px 0 #000,0 0 14px rgba(0,0,0,.6);opacity:0;transition:opacity .2s;pointer-events:none;padding:0 16px}
#tip.show{opacity:1}
#tip.red{color:#ff6b6b}
#banner{white-space:pre-line;line-height:1.05;position:fixed;left:0;right:0;top:31%;text-align:center;font-family:Bungee,Impact,sans-serif;font-size:clamp(28px,10vmin,70px);opacity:0;transform:scale(.6);transition:opacity .15s,transform .25s cubic-bezier(.2,1.6,.4,1);text-shadow:0 4px 0 #000,0 0 24px rgba(0,0,0,.5);padding:0 16px;pointer-events:none}
#banner.show{opacity:1;transform:scale(1)}
#banner.go{color:#7dffb0}#banner.win{color:#ffd23f}#banner.lose{color:#ff5a4f}#banner.warn{color:#ff5a4f;font-size:clamp(22px,7.6vmin,50px)}#banner.gold{color:#ffd23f;font-size:clamp(26px,9vmin,60px)}
#stick{position:fixed;left:0;top:0;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;border:3px solid rgba(255,255,255,.75);background:rgba(255,255,255,.12);opacity:0;transition:opacity .15s;pointer-events:none}
#stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 12px rgba(0,0,0,.4)}
#dmg b{position:fixed;left:0;top:0;font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:27px;color:#ff8a7a;text-shadow:0 3px 0 #000,0 0 6px #000;animation:pop .7s ease-out forwards;pointer-events:none}
@keyframes pop{0%{opacity:0;margin-top:0;transform:translate(-50%,-50%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}100%{opacity:0;margin-top:-46px;transform:translate(-50%,-50%) scale(1)}}
#hurt{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 30px rgba(255,30,30,.75);opacity:0}
#end{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(8,12,22,.35),rgba(8,12,22,.8));opacity:0;pointer-events:none;transition:opacity .4s;padding:16vh 16px 14vh}
#end.show{opacity:1;pointer-events:auto}
.card{display:flex;flex-direction:column;align-items:center;gap:min(2.6vh,18px);text-align:center;max-width:520px;transform:translateY(20px);transition:transform .5s cubic-bezier(.2,1.4,.4,1)}
#end.show .card{transform:none}
.logo{font-family:Bungee,Impact,sans-serif;font-size:clamp(34px,11vmin,74px);line-height:.98;color:#eef1f6;text-shadow:0 5px 0 #1b1f2e,0 10px 24px rgba(0,0,0,.6)}
.logo span{display:block;color:#ffd23f;text-shadow:0 5px 0 #8a5a00,0 10px 24px rgba(0,0,0,.6)}
#end-title{font-family:Bungee,Impact,sans-serif;font-size:clamp(18px,5vmin,30px);text-shadow:0 3px 0 #000}
#end-sub{font-size:clamp(15px,3.6vmin,20px);opacity:.92;text-shadow:0 2px 0 #000;max-width:30ch}
#cta{pointer-events:auto;font-family:Bungee,Impact,sans-serif;font-size:clamp(20px,5.6vmin,32px);color:#1a1004;background:linear-gradient(#ffe066,#ffb21a);border:0;border-radius:999px;padding:.7em 1.5em;box-shadow:0 6px 0 #a35d00,0 12px 26px rgba(0,0,0,.5);animation:pulse 1.1s ease-in-out infinite;cursor:pointer}
#cta:active{transform:translateY(4px);box-shadow:0 2px 0 #a35d00}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
#retry{pointer-events:auto;background:none;border:0;color:#fff;font:700 17px "Chakra Petch",Arial,sans-serif;opacity:.88;text-decoration:underline;padding:8px 14px;cursor:pointer}
@media (orientation:landscape){
 #hint{padding:11vh 16px 11vh}
 #hud{top:9vh;flex-direction:row;align-items:flex-start;justify-content:space-between;padding:0 16px}
 #feed{align-items:flex-end;min-height:0}
 #tip{bottom:12vh}
 #banner{top:24%}
 #end{padding:10vh 16px}
 .card{gap:min(2vh,12px)}
}
